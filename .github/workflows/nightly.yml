name: Nightly live check
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check against the payment provider's test system
        run: npm test
